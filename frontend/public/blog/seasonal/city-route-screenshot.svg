<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Скрин экскурсионного маршрута">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1b3a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="100" y="74" width="1000" height="520" rx="34" fill="#ffffff"/>
    <rect x="132" y="108" width="432" height="420" rx="28" fill="url(#sky)"/>
    <rect x="188" y="312" width="72" height="166" rx="8" fill="#334155" opacity="0.78"/>
    <rect x="286" y="250" width="92" height="228" rx="8" fill="#475569" opacity="0.78"/>
    <rect x="406" y="340" width="86" height="138" rx="8" fill="#1e3a8a" opacity="0.72"/>
    <path d="M132 474 C250 430 360 520 564 438 L564 528 L132 528Z" fill="#0ea5e9" opacity="0.44"/>
    <text x="620" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">КАРТА МАРШРУТА</text>
    <text x="620" y="192" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#0b1b3a">Когда не только море</text>
    <text x="620" y="234" font-family="Arial, sans-serif" font-size="18" fill="#536179">Города, музеи, новогодние ярмарки, СПА и короткие поездки на 3–5 дней.</text>
    <g font-family="Arial, sans-serif" font-size="17" fill="#0b1b3a">
      <circle cx="642" cy="299" r="14" fill="#2563eb"/><text x="670" y="305">Санкт-Петербург · музеи и театры</text>
      <line x1="642" y1="313" x2="642" y2="357" stroke="#cbd5e1" stroke-width="4"/>
      <circle cx="642" cy="371" r="14" fill="#f59e0b"/><text x="670" y="377">Казань · Кремль, гастрономия</text>
      <line x1="642" y1="385" x2="642" y2="429" stroke="#cbd5e1" stroke-width="4"/>
      <circle cx="642" cy="443" r="14" fill="#10b981"/><text x="670" y="449">Калининград · Балтика и прогулки</text>
    </g>
    <rect x="620" y="494" width="376" height="54" rx="27" fill="#0b1b3a"/><text x="729" y="528" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Подобрать маршрут</text>
  </g>
</svg>
