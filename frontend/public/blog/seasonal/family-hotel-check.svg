<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Скрин подбора семейного отеля">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#fff7df"/></linearGradient>
    <linearGradient id="photo" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.55" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0b1b3a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="85" y="58" width="1030" height="540" rx="38" fill="#ffffff"/>
    <rect x="126" y="104" width="330" height="398" rx="28" fill="url(#photo)"/>
    <circle cx="200" cy="175" r="50" fill="#fff4b5" opacity="0.9"/>
    <path d="M126 390 C205 330 250 425 335 350 C388 304 420 315 456 276 L456 502 L126 502Z" fill="#0f766e" opacity="0.42"/>
    <path d="M126 442 C230 370 305 500 456 412 L456 502 L126 502Z" fill="#0284c7" opacity="0.62"/>
    <text x="500" y="126" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2563eb">СКРИН ПОДБОРА</text>
    <text x="500" y="172" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#0b1b3a">Семейный отель: что проверяем</text>
    <text x="500" y="214" font-family="Arial, sans-serif" font-size="18" fill="#536179">Не только звёзды — важны питание, пляж, бассейн, трансфер и детская инфраструктура.</text>
    <g font-family="Arial, sans-serif">
      <rect x="500" y="258" width="265" height="64" rx="20" fill="#eaf6ff"/><text x="526" y="297" font-size="18" font-weight="700" fill="#0b1b3a">✓ детский клуб</text>
      <rect x="792" y="258" width="265" height="64" rx="20" fill="#ecfdf5"/><text x="818" y="297" font-size="18" font-weight="700" fill="#0b1b3a">✓ бассейн с подогревом</text>
      <rect x="500" y="344" width="265" height="64" rx="20" fill="#fff7df"/><text x="526" y="383" font-size="18" font-weight="700" fill="#0b1b3a">✓ хороший пляж</text>
      <rect x="792" y="344" width="265" height="64" rx="20" fill="#fef2f2"/><text x="818" y="383" font-size="18" font-weight="700" fill="#0b1b3a">! депозит / ужин</text>
      <rect x="500" y="456" width="557" height="58" rx="29" fill="#0b1b3a"/><text x="658" y="493" font-size="18" font-weight="800" fill="#ffffff">Отправить заявку на подбор</text>
    </g>
  </g>
</svg>
