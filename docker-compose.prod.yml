services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound only to the WireGuard tunnel address (10.10.10.1, see wg0 on this
    # host) — reachable from the Telegram bot on the Amsterdam server, not
    # from the public internet. Every other container still reaches this
    # over the compose network directly, same as before.
    ports:
      - "10.10.10.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Same reasoning as db above — Telegram bot commands on the Amsterdam
    # server enqueue Celery tasks (e.g. /sync_uon, /done) that the main
    # server's celery_worker picks up from this same broker.
    ports:
      - "10.10.10.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: python manage.py run_telegram_bot
    env_file:
      - .env
    # api.telegram.org resolves to both an A and AAAA record; the default
    # Docker bridge network has no IPv6 route, so httpx's Happy-Eyeballs
    # logic tries the AAAA address first and fails immediately with
    # "Network is unreachable" instead of falling back to IPv4 (confirmed
    # live, 18.08.2026 — this, not Russian ISP throttling, was the actual
    # cause of every TimedOut/Conflict seen while debugging the bot today).
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      # `all` alone leaves eth0 (created by Docker's own networking setup,
      # which runs after this sysctl is applied) in a half-disabled state —
      # confirmed live: httpx then fails with errno 99 "Cannot assign
      # requested address" instead of a clean IPv4 connection. `default`
      # is what new interfaces actually inherit.
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_UON_CABINET_URL: ${NEXT_PUBLIC_UON_CABINET_URL}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - backend_media:/srv/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  backend_media:
  caddy_data:
  caddy_config:
